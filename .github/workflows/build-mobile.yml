name: Build Mobile Partner App (Expo APK)

on:
  workflow_dispatch:
  push:
    branches:
      - main

# A newer push replaces a release build that is still running
concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Gradle downloads and compiled native libraries are kept between builds
      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Bump Version
        run: |
          npm version 1.0.${{ github.run_number }} --no-git-tag-version
          sed -i 's/"version": "1.0.0"/"version": "1.0.'${{ github.run_number }}'"/' app.json
          sed -i 's/"versionCode": 1/"versionCode": '${{ github.run_number }}'/' app.json || true

      - name: Prebuild Expo Android
        run: npx expo prebuild -p android --clean

      # Phones only: 64-bit and 32-bit ARM. Leaving out the x86 emulator builds halves the
      # native compile time; no shop phone runs x86.
      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --build-cache --parallel

      - name: Rename APK
        working-directory: ./android/app/build/outputs/apk/release
        run: mv app-release.apk FunPrintingPartner.apk

      - name: Create Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
