name: Verify

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Generate the Android project (includes the native printer search module)
        run: npx expo prebuild -p android --clean
      - name: Compile the Android app (debug build, nothing is published)
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon
