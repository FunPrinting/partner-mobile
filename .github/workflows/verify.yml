name: Verify

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks on every push (about 2-3 minutes): types, tests, lint, and the JavaScript
  # bundle the app runs (catches broken imports that would crash it at start-up).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      native: ${{ steps.changes.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx expo lint
      - name: Bundle the app for Android
        run: npx expo export --platform android --output-dir /tmp/export
      - name: Did native code or native config change?
        id: changes
        run: |
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "native=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(modules/|app\.json|package\.json|package-lock\.json|plugins/|eas\.json)'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  # The slow Android compile only when native code, native config or dependencies changed
  # (or on demand); JavaScript-only changes are covered by the bundle step above.
  android:
    needs: check
    if: needs.check.outputs.native == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci || npm install
      - name: Generate the Android project (includes the native printer search module)
        run: npx expo prebuild -p android --clean
      - name: Compile the Android app (debug, 64-bit ARM only, nothing is published)
        working-directory: ./android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --build-cache --parallel
